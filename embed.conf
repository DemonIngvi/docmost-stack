# Docmost для встраивания в LibreChat. Основной порт 3100 не меняется.
# Запрет показа заменён разрешением только для адреса LibreChat.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 100m;

    location / {
        proxy_pass http://docmost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:3100;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors http://localhost:3080 http://127.0.0.1:3080" always;
    }
}
