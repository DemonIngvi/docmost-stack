# Порт 80: Docmost для панели. Порт 81: LibreChat с панелью документации.
# Основные порты 3100 и 3080 не меняются.
# Запрет показа заменён разрешением только для адреса LibreChat.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 100m;

    location / {
        proxy_pass http://docmost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:3100;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors http://localhost:3090 http://127.0.0.1:3090" always;
    }
}

server {
    listen 81;

    location = /doc-panel.js {
        alias /etc/nginx/doc-panel.js;
        default_type application/javascript;
    }

    location / {
        proxy_pass http://librechat:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        sub_filter '</head>' '<script src="/doc-panel.js"></script></head>';
        sub_filter_once on;
    }
}
