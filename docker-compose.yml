# Основан на официальном docker-compose.upstream.yml.
# Отличия: секреты в .env, порт 3100 вместо занятого 3000, доступ только с localhost.
name: docmost

services:
  docmost:
    image: docmost/docmost:latest
    depends_on:
      - db
      - redis
    environment:
      APP_URL: ${APP_URL}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://docmost:${POSTGRES_PASSWORD}@db:5432/docmost
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3100:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  embed:
    image: nginx:1.29-alpine
    depends_on:
      - docmost
    ports:
      - "127.0.0.1:3101:80"
    restart: unless-stopped
    volumes:
      - ./embed.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
